[project]
name = "resize-bot"
version = "0.1.0"
description = "App3 /creatives — audience-driven ad banner generation: Cloud.ru FM + App1 hero + PIL template composer"
requires-python = ">=3.10"
readme = "HANDOFF.md"

# Core: the LangGraph pipeline, Cloud.ru FM client, PIL composer.
# No Redis — App3 (the VM web deploy) must not require it (platform
# decision 2026-06-21: no Redis on the VM; SQLite checkpointer instead).
dependencies = [
    # >=1.2.6: 1.1.x regressed interrupt() inside async nodes on Python 3.10
    # ("Called get_config outside of a runnable context"). Without an upper pin
    # the resolver picked 1.1.10 on the VM. Keep this floor.
    "langgraph>=1.2.6",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx[http2]>=0.27.2",
    "truststore>=0.10.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

# Installable extras (PEP 621 optional-dependencies) — this is what
# `pip install -e '.[web]'` resolves. (NOTE: dependency-groups below are
# PEP 735 and are NOT picked up by `pip install .[extra]`; that mismatch
# was breaking the VM deploy, so web lives here as a real extra.)
[project.optional-dependencies]
# App3 / creatives web sub-app layer (FastAPI behind the platform gateway).
# SQLite-backed langgraph checkpointer (no Redis). Install on the VM:
#   pip install -e '.[web]'
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0,<0.21.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    # >=3.0.0: the <3 cap forced langgraph back to 1.1.x (1.2.6 needs
    # langgraph-checkpoint 4.x, which sqlite 2.0.x cannot satisfy). 3.1.0
    # pairs with checkpoint 4.x and langgraph 1.2.6.
    "langgraph-checkpoint-sqlite>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm", "graph", "agents", "infra", "app"]
# Ship the web sub-app's non-Python assets (page template, CSS/JS, fonts).
artifacts = [
    "app/templates/**",
    "app/static/**",
]
