[project]
name = "resize-bot"
version = "0.1.0"
description = "Audience-driven ad generation Telegram bot — Cloud.ru FM + user-uploaded hero + PIL template composer (M3.3)"
requires-python = ">=3.11"
readme = "HANDOFF.md"

dependencies = [
    "python-telegram-bot[ext]==22.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-redis>=0.0.6",
    "langchain-mcp-adapters>=0.0.5",
    "mcp>=1.1.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx[http2]>=0.27.2",
    "truststore>=0.10.0",
    "pillow>=10.4.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "llm", "graph", "agents", "infra"]
