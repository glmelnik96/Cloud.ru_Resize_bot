[project]
name = "resize-bot"
version = "0.1.0"
description = "Audience-driven ad generation Telegram bot — Cloud.ru FM + user-uploaded hero + PIL template composer (M3.3)"
requires-python = ">=3.10"
readme = "HANDOFF.md"

# Shared core: the LangGraph /new pipeline, Cloud.ru FM client, PIL composer.
# Redis is NOT here — App3 (the VM web deploy) must not require it (platform
# decision 2026-06-21: no Redis on the VM). Redis lives in the [bot] group,
# used only by the Telegram bot's Docker deploy.
dependencies = [
    "langgraph>=0.2.50",
    "langchain-mcp-adapters>=0.0.5",
    "mcp>=1.1.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx[http2]>=0.27.2",
    "truststore>=0.10.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

# Installable extras (PEP 621 optional-dependencies) — these are what
# `pip install -e '.[web]'` / `'.[bot]'` resolve. (NOTE: dependency-groups
# below are PEP 735 and are NOT picked up by `pip install .[extra]`; that
# mismatch was breaking the VM deploy, so web/bot live here as real extras.)
[project.optional-dependencies]
# App3 / creatives web sub-app layer (FastAPI behind the platform gateway).
# SQLite-backed langgraph checkpointer (no Redis). Install on the VM:
#   pip install -e '.[web]'
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0,<0.21.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<3.0.0",
]
# Telegram bot deploy (Docker): PTB + Redis-backed langgraph checkpointer.
bot = [
    "python-telegram-bot[ext]==22.0",
    "langgraph-checkpoint-redis>=0.0.6",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "llm", "graph", "agents", "infra", "app"]
# Ship the web sub-app's non-Python assets (page template, CSS/JS, fonts).
artifacts = [
    "app/templates/**",
    "app/static/**",
]
