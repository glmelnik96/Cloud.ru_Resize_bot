id: evaluate_as_persona_loop
skill: prompts/persona_eval.md
model: glm-5.1
model_config:
  thinking: true
  max_tokens: 3000
  temperature: 0.6
schema: graph.state.Verdict
retry_with_feedback: 1
pre_hooks: []
post_hooks: []
# concurrency.semaphore is consumed by the node, not by run_agent —
# each per-(candidate × persona) call is a single agent run wrapped by sem.
concurrency:
  semaphore: 3
revise:
  threshold: 6.5
  max_rounds: 2
