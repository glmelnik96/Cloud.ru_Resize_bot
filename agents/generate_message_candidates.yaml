id: generate_message_candidates
skill: prompts/creative_ads_explorer.md
model: glm-4.7
model_config:
  thinking: false
  max_tokens: 8000  # 12 propositions (was 4000 for 3-5)
  temperature: 0.8
schema: graph.state.CandidateSet
retry_with_feedback: 1
pre_hooks: []
post_hooks:
  # M3.3: char-limit hard fails dropped (they were for Figma layer width).
  # PIL composer auto-shrinks text, so length is enforced at render time.
  # We keep warn-only soft targets on word bands instead.

  # slogan: 3-6 words soft target — what actually goes on the macro.
  - id: text_len
    field: slogan
    min_words: 3
    max_words: 6
    on_violation: warn

  # cta: 1 word soft target (button label, single verb).
  - id: text_len
    field: cta
    min_words: 1
    max_words: 1
    on_violation: warn

  # body: kept as a draft description / reference for downstream stages.
  # Not used in final macro, but should not balloon.
  - id: text_len
    field: body
    max: 180
    on_violation: warn

  # global: no emojis anywhere
  - id: ban_emoji
    fields: [slogan, body, cta]
    on_violation: fail

  # brand guards (AGENTS.md §4.1)
  - id: brand_stopwords
    groups: [A, B, C, D]
    fields: [slogan, body, cta]
    on_violation: fail

  # NOTE: hook_diversity dropped (2026-06-21 redesign) — with 12 propositions
  # and 7 hook_angle values, per-candidate uniqueness is impossible. Diversity
  # is now built at generation time (12 angles into one persona, each anchored
  # on a distinct pain/motivation/objection), not enforced post-hoc.

  # calm tone: no `!` in slogan (CTA is allowed). warn — see AGENTS.md §4.4.
  - id: no_exclamation_in_slogan
    on_violation: warn
